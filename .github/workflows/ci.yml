name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # bench spawns a real `node` process that resolves @mudah-cli/* to dist via
      # exports, so the dist must exist before the cold-start budget is measured.
      - run: npm run build
      - run: npm run typecheck
      # Vitest via `npm run test` runs under Node, so Bun.Image is undefined
      # and convert-img cannot encode. `bun run test` keeps the same suite
      # with the Bun runtime (Bun.Image for png/jpeg/webp).
      - run: bun run test
      - run: npm run bench -- --check
